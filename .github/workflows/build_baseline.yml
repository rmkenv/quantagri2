name: Build Self-Baseline

# Runs in ~2 minutes. No external data dependencies.
# Builds baseline from existing Sentinel-2 NDVI files in data/ndvi/.
# Falls back to agronomic parameterisation for nodes with no S2 data yet.
# Run this once after initial backfill, or after adding new regions.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to include (space-separated, default: 2016-2024)'
        type: string
        default: '2016 2017 2018 2019 2020 2021 2022 2023 2024'
      force:
        description: 'Rebuild even if real baseline already exists'
        type: boolean
        default: false

jobs:
  build:
    name: Build self-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install numpy scipy -q

      - name: Build self-baseline
        run: |
          python scripts/build_self_baseline.py \
            --years ${{ github.event.inputs.years }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit baselines
        run: |
          git config user.name  "quantagri-bot"
          git config user.email "bot@quantagri.local"
          git add data/baseline/
          git diff --staged --quiet \
            && echo "Nothing to commit" \
            || (git commit -m "feat: self-baseline from S2 archive $(date -u '+%Y-%m-%d')" \
            && git pull --rebase origin main \
            && git push origin main)
